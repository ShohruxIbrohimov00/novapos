<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NovaPOS</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/img/icon-192.png" />
  <link rel="icon" type="image/png" href="/static/img/icon-96.png" />
  <!-- Lokal shrift va ikonkalar (internetsiz ishlashi uchun) -->
  <link rel="preload" href="/static/vendor/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/vendor/fonts/plus-jakarta-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
  <script>
    // Birinchi chizishdan OLDIN: tema va kirish tekshiruvi (lip-lip qilmasligi uchun)
    (function () {
      var d = document.documentElement, t = null, tok = null, ok = false;
      try { t = localStorage.getItem('pos_theme'); tok = localStorage.getItem('access_token'); } catch (e) {}
      d.setAttribute('data-theme', t || 'light');
      try {
        if (tok) {
          var pl = JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
          ok = Date.now() < pl.exp * 1000 - 30000;
        }
      } catch (e) {}
      // Kirish sahifalarida tekshiruv yo'q (aks holda cheksiz aylanadi)
      if (!ok && !/^\/app\/(login|register)/.test(location.pathname)) location.replace('/app/login');
    })();
  </script>
  <script type="module" crossorigin src="/static/app/assets/index-BBDfN-yR.js"></script>
  <link rel="stylesheet" crossorigin href="/static/app/assets/index-aO8iR6C7.css">
  <meta name="app-version" content="200ef9f92a81">
</head>
<body>
  <div id="root"></div>
  <script>
    // Ilova umuman ishga tushmasa (fayl yuklanmadi, eski brauzer) — oq ekran o'rniga xabar
    setTimeout(function () {
      var r = document.getElementById('root');
      if (!r || r.childNodes.length) return;
      r.innerHTML = '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif">'
        + '<div><div style="font-size:20px;font-weight:800;margin-bottom:8px">Ilova yuklanmadi</div>'
        + '<div style="color:#64748b;margin-bottom:20px">Internetni tekshirib, qayta urinib ko\'ring.</div>'
        + '<button onclick="location.reload()" style="padding:14px 28px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:700">Qayta yuklash</button></div></div>';
    }, 10000);
  </script>
</body>
</html>
