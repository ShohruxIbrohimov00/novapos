# Har push va pull request'da avtomatik tekshiruv.
# Biror qadam qizil bo'lsa — o'zgarishni serverga qo'yishdan oldin tuzating.
name: Tekshiruv

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Build repoga qo'shiladi (serverda Node.js yo'q) — commit qilingan build manbaga mos bo'lishi shart
      - name: Commit qilingan build yangimi
        run: |
          if [ -n "$(git status --porcelain -- ../webapp/static/app)" ]; then
            echo "::error::webapp/static/app eskirgan. 'cd frontend && npm run build' qilib, natijani commit qiling."
            git status --short -- ../webapp/static/app
            exit 1
          fi
