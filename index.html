<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  :root {
    --lime: #c6ff3a;
    --bg-dark: #0a0f0a;
    --bg-panel: #111811;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 {
    color: var(--lime);
    letter-spacing: 2px;
    font-size: 22px;
    text-shadow: 0 0 14px rgba(198,255,58,0.5);
  }
  #gameCanvas {
    background: linear-gradient(180deg, #0d1a12 0%, #0a0f0a 100%);
    border: 2px solid var(--lime);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(198,255,58,0.25), inset 0 0 40px rgba(198,255,58,0.05);
    cursor: pointer;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 360px;
    color: #9fdc6e;
    font-size: 14px;
  }
  #hud span { color: var(--lime); font-weight: bold; }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(10,15,10,0.85);
    border-radius: 12px;
    color: var(--lime);
    text-align: center;
    padding: 20px;
  }
  #overlay h2 { font-size: 24px; }
  #overlay p { color: #9fdc6e; font-size: 13px; max-width: 260px; }
  #startBtn {
    margin-top: 10px;
    padding: 10px 26px;
    background: var(--lime);
    color: #0a0f0a;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(198,255,58,0.4);
    transition: transform 0.15s ease;
  }
  #startBtn:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
  footer {
    color: #4d6b3a;
    font-size: 11px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>FLAPPY BIRD</h1>
  <div id="hud">
    <div>Ball: <span id="scoreLabel">0</span></div>
    <div>Rekord: <span id="bestLabel">0</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="gameCanvas" width="360" height="520"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">FLAPPY BIRD</h2>
      <p id="overlayText">Uchish uchun bo'sh joy (Space) tugmasini bosing yoki ekranga bosing. Trubalarga urilmang!</p>
      <button id="startBtn">BOSHLASH</button>
    </div>
  </div>
  <footer>SPACE / CLICK / TAP — uchish</footer>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');
const scoreLabel = document.getElementById('scoreLabel');
const bestLabel = document.getElementById('bestLabel');

let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
bestLabel.textContent = best;

// TOP-3 kuchli natijalar ro'yxati
let topScores = JSON.parse(localStorage.getItem('flappy_top3') || '[]');

const GRAVITY = 0.45;
const FLAP = -5;      // tepaga sakrash kuchi
const PIPE_GAP = 150;
const PIPE_WIDTH = 60;
const PIPE_SPEED = 2.6;
const PIPE_INTERVAL = 100; // frames

let bird, pipes, frame, score, state; // state: 'ready' | 'playing' | 'over'

function resetGame() {
  bird = { x: 80, y: H / 2, vy: 0, r: 14, rot: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  scoreLabel.textContent = score;
  state = 'ready';
}

function spawnPipe() {
  const margin = 60;
  const topH = margin + Math.random() * (H - PIPE_GAP - margin * 2);
  pipes.push({ x: W, top: topH, passed: false });
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    overlay.classList.add('hidden');
  }
  if (state === 'playing') {
    bird.vy = FLAP;
  }
  if (state === 'over') {
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
  }
}

function update() {
  if (state !== 'playing') return;
  frame++;

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.max(-25, Math.min(90, bird.vy * 5));

  if (frame % PIPE_INTERVAL === 0) spawnPipe();

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED;

    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreLabel.textContent = score;
    }

    if (p.x + PIPE_WIDTH < -10) {
      pipes.splice(i, 1);
    }

    const withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH;
    const hitTop = bird.y - bird.r < p.top;
    const hitBottom = bird.y + bird.r > p.top + PIPE_GAP;
    if (withinX && (hitTop || hitBottom)) {
      gameOver();
    }
  }

  if (bird.y + bird.r > H - 20 || bird.y - bird.r < 0) {
    gameOver();
  }
}

function gameOver() {
  state = 'over';

  const isNewBest = score > best;
  if (isNewBest) {
    best = score;
    localStorage.setItem('flappy_best', best);
    bestLabel.textContent = best;
  }

  // TOP-3 ga kirish-kirmasligini tekshirish
  const sortedBefore = [...topScores].sort((a, b) => b - a);
  const qualifiesTop3 = sortedBefore.length < 3 || score > sortedBefore[sortedBefore.length - 1];

  if (qualifiesTop3) {
    topScores.push(score);
    topScores = topScores.sort((a, b) => b - a).slice(0, 3);
    localStorage.setItem('flappy_top3', JSON.stringify(topScores));
  }

  if (isNewBest) {
    overlayTitle.textContent = "🏆 YANGI REKORD!";
    overlayText.textContent = `Ajoyib! Siz ${score} ball bilan yangi shaxsiy rekord o'rnatdingiz!`;
  } else if (qualifiesTop3) {
    overlayTitle.textContent = "🎉 TOP-3 GA TABRIKLAYMIZ!";
    overlayText.textContent = `${score} ball bilan siz eng kuchli 3 talikka kirdingiz!`;
  } else {
    overlayTitle.textContent = "O'YIN TUGADI";
    overlayText.textContent = `Sizning ballingiz: ${score}. Qayta urinish uchun bosing.`;
  }
  startBtn.textContent = "QAYTA O'YNASH";
  overlay.classList.remove('hidden');
}

function drawBackground() {
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1a12');
  grad.addColorStop(1, '#0a0f0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // subtle grid lines
  ctx.strokeStyle = 'rgba(198,255,58,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  // ground
  ctx.fillStyle = '#16210f';
  ctx.fillRect(0, H - 20, W, 20);
  ctx.strokeStyle = '#c6ff3a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 20);
  ctx.lineTo(W, H - 20);
  ctx.stroke();
}

function drawPipes() {
  pipes.forEach(p => {
    ctx.fillStyle = '#1c2914';
    ctx.strokeStyle = '#c6ff3a';
    ctx.lineWidth = 2;

    // top pipe
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);

    // bottom pipe
    const bottomY = p.top + PIPE_GAP;
    ctx.fillRect(p.x, bottomY, PIPE_WIDTH, H - bottomY - 20);
    ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, H - bottomY - 20);

    // glow caps
    ctx.fillStyle = '#c6ff3a';
    ctx.fillRect(p.x - 3, p.top - 12, PIPE_WIDTH + 6, 12);
    ctx.fillRect(p.x - 3, bottomY, PIPE_WIDTH + 6, 12);
  });
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot * Math.PI / 180);

  ctx.fillStyle = '#c6ff3a';
  ctx.shadowColor = '#c6ff3a';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // eye
  ctx.fillStyle = '#0a0f0a';
  ctx.beginPath();
  ctx.arc(5, -4, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#0a0f0a';
  ctx.beginPath();
  ctx.moveTo(bird.r - 2, 0);
  ctx.lineTo(bird.r + 8, -2);
  ctx.lineTo(bird.r - 2, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawScoreOnCanvas() {
  if (state === 'playing') {
    ctx.fillStyle = 'rgba(198,255,58,0.85)';
    ctx.font = 'bold 34px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(score, W / 2, 60);
  }
}

function loop() {
  update();
  drawBackground();
  drawPipes();
  drawBird();
  drawScoreOnCanvas();
  requestAnimationFrame(loop);
}

// controls
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
startBtn.addEventListener('click', (e) => { e.stopPropagation(); flap(); });

resetGame();
loop();
</script>
</body>
</html>
