# /etc/nginx/sites-available/novapos  (pos.sizning-domen.uz ni o'zgartiring)
# HTTPS sertifikat:  sudo certbot --nginx -d pos.sizning-domen.uz
server {
    listen 80;
    server_name pos.sizning-domen.uz;

    client_max_body_size 10m;   # to'lov cheki, AI scan rasmlari

    # Statik fayllar — to'g'ridan-to'g'ri nginx dan (tez)
    location /static/ {
        alias /opt/novapos/webapp/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }
    # Ilova versiyasi — "Yangi versiya chiqdi" tekshiruvi uchun hech qachon keshlanmasin
    location = /static/app/version.json {
        alias /opt/novapos/webapp/static/app/version.json;
        add_header Cache-Control "no-cache";
    }
    location /static/uploads/ {
        alias /opt/novapos/webapp/static/uploads/;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox";
        add_header X-Content-Type-Options nosniff;
    }

    # Service Worker hech qachon keshlanmasin (yangilanishlar darhol yetib borsin)
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache";
    }

    # WebSocket (real-time)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
